/* --- 게임 1: 산성비 (속도 판정) --- */
function makeRain(done,o={}){
  let q=false;const R=mulberry(o.seed??Math.floor(Math.random()*1e9)),WORDS=themeWords('rain'),GROUND=356,DUR=o.dur||dur(60);
  let el=0,words=[],score=0,combo=0,lives=5,hits=0,fx=[],acc=1.2;const gr={P:0,G:0,O:0};
  const spawn=lv=>{const t=WORDS[Math.floor(R()*WORDS.length)];cx.font='bold 20px "IBM Plex Sans KR"';const w=cx.measureText(t).width;
    words.push({t,x:14+R()*Math.max(1,AW-28-w),y:-6,w,v:30+lv*13+R()*18})};
  const stop=runLoop(dt=>{
    el+=dt;const lv=1+Math.floor(el/15),left=Math.max(0,DUR-el);
    acc+=dt;if(acc>=Math.max(.55,1.55-lv*.22)){acc=0;spawn(lv)}
    words.forEach(w=>w.y+=w.v*dt);
    const lost=words.filter(w=>w.y>=GROUND-4);
    if(lost.length){lives-=lost.length;combo=0;sfx('miss');lost.forEach(w=>fx.push({x:w.x+w.w/2,y:GROUND,t:0,c:C.warn,ring:1}));words=words.filter(w=>w.y<GROUND-4)}
    clear();
    cx.setLineDash([4,6]);cx.strokeStyle='rgba(143,178,255,.16)';[GROUND*.35,GROUND*.65].forEach(y=>{cx.beginPath();cx.moveTo(0,y);cx.lineTo(AW,y);cx.stroke()});cx.setLineDash([]);
    cx.font='8px "Press Start 2P"';cx.textAlign='right';
    cx.fillStyle='rgba(255,214,107,.5)';cx.fillText('PERFECT x2',AW-12,GROUND*.35-7);cx.fillStyle='rgba(95,224,200,.5)';cx.fillText('GREAT x1.5',AW-12,GROUND*.65-7);cx.fillStyle='rgba(143,178,255,.5)';cx.fillText('GOOD',AW-12,GROUND-10);
    const typed=$('#typeIn').value.trim();
    words.forEach(w=>{cx.font='bold 20px "IBM Plex Sans KR"';cx.textAlign='left';cx.fillStyle=typed&&w.t.startsWith(typed)?C.hi:C.fg;cx.fillText(w.t,w.x,w.y)});
    fx=drawFx(fx,dt);
    cx.fillStyle=C.wall;cx.fillRect(0,GROUND,AW,AH-GROUND);
    for(let i=0;i<5;i++){cx.fillStyle=i<lives?C.hi:C.dim;cx.fillRect(16+i*22,GROUND+16,16,16)}
    cx.fillStyle=C.fg;cx.font='15px "Do Hyeon"';cx.textAlign='left';cx.fillText('우리 교실 지붕',134,GROUND+29);
    hud(score,left,'LV'+lv);
    cx.textAlign='left';if(o.label){cx.fillStyle=C.gold;cx.font='14px "Press Start 2P"';cx.fillText(o.label,16,30)}
    if(combo>1){cx.fillStyle=C.hi;cx.font='10px "Press Start 2P"';cx.fillText(`COMBO x${combo}`,o.label?60:16,30)}
    if(lives<=0||left<=0||q){done(score,`PERFECT ${gr.P} · GREAT ${gr.G} · GOOD ${gr.O} · 막은 산성비 ${hits}개`);return false}
  });
  return{quit(){q=true},stop,text(v){
    const h=words.filter(w=>w.t===v).sort((a,b)=>b.y-a.y);if(!h.length){combo=0;return false}
    const w=h[0];words=words.filter(x=>x!==w);combo++;hits++;
    const f=w.y/GROUND,g=f<.35?'P':f<.65?'G':'O';gr[g]++;
    const pts=Math.round(w.t.length*10*{P:2,G:1.5,O:1}[g]*(1+Math.min(combo,10)*.1));score+=pts;
    fx.push({x:w.x+w.w/2,y:w.y,t:0,c:GRADE[g].c,ring:1},{x:w.x+w.w/2,y:w.y-10,t:0,s:`${GRADE[g].t} +${pts}`,c:GRADE[g].c,big:1});
    sfx(g==='P'?'perfect':g==='G'?'great':'hit');return true}};
}

/* --- 게임 2: 키워드 두더지 (반응속도 판정) --- */
function makeMole(done){
  let q=false;const GOOD=themeWords('mole'),BADS=['공문','민원','야근'],DUR=dur(30);
  const holes=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)holes.push({x:150+c*170,y:120+r*98,m:null});
  let el=0,score=0,hits=0,fx=[],acc=0,badHits=0;const gr={P:0,G:0,O:0};
  const spawn=()=>{const free=holes.filter(h=>!h.m);if(!free.length)return;const h=pick(free),r=Math.random();
    const kind=r<.1?'gold':r<.32?'bad':'good';h.m={word:kind==='gold'?'칭찬':kind==='bad'?pick(BADS):pick(GOOD),kind,born:el,life:Math.max(.75,1.45-el*.022),hit:false}};
  const stop=runLoop(dt=>{
    el+=dt;const left=Math.max(0,DUR-el);
    acc+=dt;if(acc>=Math.max(.32,.78-el*.014)){acc=0;spawn()}
    holes.forEach(h=>{if(h.m&&el-h.m.born>(h.m.hit?h.m.hitAt-h.m.born+.25:h.m.life))h.m=null});
    clear();cx.fillStyle=C.hi;cx.font='10px "Press Start 2P"';cx.textAlign='left';cx.fillText(`HIT ${hits}`,16,28);
    cx.fillStyle=C.gold;cx.fillText(`PERFECT ${gr.P}`,16,46);
    holes.forEach(h=>{
      cx.fillStyle='#030A1E';cx.beginPath();cx.ellipse(h.x,h.y+20,64,17,0,0,7);cx.fill();
      if(!h.m)return;const m=h.m,age=el-m.born,p=m.hit?Math.max(0,1-(el-m.hitAt)*4):Math.max(0,Math.min(1,age/.12,(m.life-age)/.12));
      cx.save();cx.beginPath();cx.rect(h.x-80,h.y-80,160,100);cx.clip();
      const top=h.y+20-58*p;cx.fillStyle=m.kind==='bad'?C.warn:m.kind==='gold'?C.gold:C.alt;
      cx.beginPath();cx.roundRect?cx.roundRect(h.x-56,top,112,60,[22,22,6,6]):cx.rect(h.x-56,top,112,60);cx.fill();
      cx.fillStyle='#081330';cx.font='bold 18px "IBM Plex Sans KR"';cx.textAlign='center';cx.fillText(m.word,h.x,top+30);
      if(!m.hit&&m.kind!=='bad'){const k=Math.min(1,age/.7);cx.fillStyle=k<.57?C.gold:k<1?C.hi:C.alt;cx.fillRect(h.x-40,top+44,80*(1-k),4)}
      cx.restore();
    });
    fx=drawFx(fx,dt);hud(score,left);
    if(left<=0||q){done(score,`PERFECT ${gr.P} · GREAT ${gr.G} · GOOD ${gr.O} · 공문 클릭 ${badHits}번`);return false}
  });
  return{quit(){q=true},stop,ptr(t,x,y){if(t!=='down')return;
    for(const h of holes){const m=h.m;if(!m||m.hit)continue;if(Math.abs(x-h.x)<62&&y>h.y-50&&y<h.y+28){
      m.hit=true;m.hitAt=el;
      if(m.kind==='bad'){score=Math.max(0,score-15);badHits++;sfx('bad');fx.push({x:h.x,y:h.y-40,t:0,s:'-15',c:C.warn,big:1});break}
      const rt=el-m.born,g=rt<.4?'P':rt<.7?'G':'O';gr[g]++;hits++;
      const pts={P:20,G:15,O:10}[g]*(m.kind==='gold'?3:1);score+=pts;
      sfx(g==='P'?'perfect':g==='G'?'great':'hit');fx.push({x:h.x,y:h.y-40,t:0,s:`${GRADE[g].t} +${pts}`,c:GRADE[g].c,big:1});break}}}};
}

/* --- 게임 3: 교실 벽돌깨기 --- */
function makeBrick(done){
  let q=false;const LAB=['수업','나눔','배움','성장','협력','질문','기록','평가','소통','공감','도전','연구','AI','디지털','독서','진로','생태','안전','동료','학생','교실','내일','선도','쉼'];
  const cols=6,rows=4,bw=94,bh=28,gap=8,ox=18,oy=62,DUR=dur(90);
  let bricks=[],score=0,lives=3,speed=300,broke=0,el=0,fx=[];const keys={L:false,R:false};
  const pad={x:320,w:104,y:368},ball={x:320,y:360,vx:0,vy:0,r:7,stuck:true,wait:.8};
  const build=()=>{bricks=[];let k=rnd(0,LAB.length);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:ox+c*(bw+gap),y:oy+r*(bh+gap),label:LAB[(k++)%LAB.length],gold:Math.random()<.08,alive:true})};
  build();
  const stop=runLoop(dt=>{
    el+=dt;const left=Math.max(0,DUR-el);
    if(keys.L)pad.x-=520*dt;if(keys.R)pad.x+=520*dt;pad.x=Math.max(pad.w/2,Math.min(AW-pad.w/2,pad.x));
    if(ball.stuck){ball.x=pad.x;ball.y=pad.y-ball.r-1;ball.wait-=dt;if(ball.wait<=0){ball.stuck=false;const a=(Math.random()-.5)*.8;ball.vx=speed*Math.sin(a);ball.vy=-speed*Math.cos(a)}}
    else{
      ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>AW-ball.r){ball.x=AW-ball.r;ball.vx=-Math.abs(ball.vx)}
      if(ball.y<ball.r+50){ball.y=ball.r+50;ball.vy=Math.abs(ball.vy)}
      if(ball.vy>0&&ball.y+ball.r>=pad.y&&ball.y<pad.y+14&&Math.abs(ball.x-pad.x)<pad.w/2+ball.r){
        const a=(ball.x-pad.x)/(pad.w/2)*1.05;ball.vx=speed*Math.sin(a);ball.vy=-speed*Math.cos(a);ball.y=pad.y-ball.r;sfx('click')}
      for(const b of bricks){if(!b.alive)continue;
        const nx=Math.max(b.x,Math.min(ball.x,b.x+bw)),ny=Math.max(b.y,Math.min(ball.y,b.y+bh));
        if((ball.x-nx)**2+(ball.y-ny)**2<=ball.r*ball.r){b.alive=false;broke++;const p=b.gold?30:10;score+=p;sfx(b.gold?'perfect':'hit');
          fx.push({x:b.x+bw/2,y:b.y+bh/2,t:0,s:'+'+p,c:b.gold?C.gold:C.hi});
          if(ball.x<b.x||ball.x>b.x+bw)ball.vx=-ball.vx;else ball.vy=-ball.vy;break}}
      if(ball.y>AH+10){lives--;sfx('miss');ball.stuck=true;ball.wait=.8}
      if(bricks.every(b=>!b.alive)){score+=100;speed*=1.12;build();ball.stuck=true;ball.wait=.8;sfx('record')}
    }
    clear();cx.fillStyle=C.dim;cx.fillRect(0,50,AW,1);
    bricks.forEach(b=>{if(!b.alive)return;cx.fillStyle=b.gold?C.hi:C.wall;cx.fillRect(b.x,b.y,bw,bh);
      cx.fillStyle=b.gold?'#081330':C.fg;cx.font='600 14px "IBM Plex Sans KR"';cx.textAlign='center';cx.fillText(b.label,b.x+bw/2,b.y+19)});
    cx.fillStyle=C.alt;cx.fillRect(pad.x-pad.w/2,pad.y,pad.w,12);cx.fillStyle='#081330';cx.font='11px "IBM Plex Sans KR"';cx.textAlign='center';cx.fillText('교탁',pad.x,pad.y+10);
    cx.fillStyle=C.hi;cx.beginPath();cx.arc(ball.x,ball.y,ball.r,0,7);cx.fill();
    for(let i=0;i<3;i++){cx.fillStyle=i<lives?C.hi:C.dim;cx.beginPath();cx.arc(22+i*20,30,6,0,7);cx.fill()}
    fx=drawFx(fx,dt);hud(score,left);
    if(lives<=0||left<=0||q){done(score,`깬 벽돌 ${broke}개`);return false}
  });
  return{quit(){q=true},stop,ptr(t,x){pad.x=x},key(k,down){const d=DIRS[k];if(d==='L'||d==='R')keys[d]=down}};
}

/* --- 게임 4: 2048 성장판 --- */
function makeMerge(done){
  let q=false;const NAME={2:'분필',4:'출석부',8:'교과서',16:'수업안',32:'수업나눔',64:'학습공동체',128:'AI-e랩 연구교사',256:'우수사례',512:'명예의전당',1024:'레전드',2048:'교육의 별'};
  const N=4,CS=78,G=8,BX=144,BY=40,DUR=dur(120);
  let grid=Array.from({length:N},()=>Array(N).fill(0)),score=0,best=2,el=0,pop=null,ended=false;
  const add=()=>{const e=[];grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)e.push([x,y])}));if(!e.length)return;const[x,y]=pick(e);grid[y][x]=Math.random()<.9?2:4;pop={x,y,t:performance.now()}};
  add();add();
  const line=(i,d)=>Array.from({length:N},(_,k)=>d==='L'?[k,i]:d==='R'?[N-1-k,i]:d==='U'?[i,k]:[i,N-1-k]);
  function move(d){
    if(ended)return;let moved=false,merged=0;const before=best;
    for(let i=0;i<N;i++){const cells=line(i,d),a=cells.map(([x,y])=>grid[y][x]).filter(v=>v);
      for(let k=0;k<a.length-1;k++)if(a[k]===a[k+1]){a[k]*=2;score+=a[k];merged++;best=Math.max(best,a[k]);a.splice(k+1,1)}
      while(a.length<N)a.push(0);cells.forEach(([x,y],k)=>{if(grid[y][x]!==a[k])moved=true;grid[y][x]=a[k]})}
    if(moved){add();sfx(best>before?'perfect':merged?'great':'click')}
  }
  const canMove=()=>grid.some((r,y)=>r.some((v,x)=>!v||(x<N-1&&v===r[x+1])||(y<N-1&&v===grid[y+1][x])));
  const col=v=>{const t=Math.min(1,(Math.log2(v)-1)/9),a=[31,79,160],b=[95,224,200];return `rgb(${a.map((c,i)=>Math.round(c+(b[i]-c)*t)).join(',')})`};
  const stop=runLoop((dt,now)=>{
    el+=dt;const left=Math.max(0,DUR-el);clear();
    cx.fillStyle='#0F1E45';cx.fillRect(BX-G,BY-G,N*CS+(N+1)*G,N*CS+(N+1)*G);
    grid.forEach((r,y)=>r.forEach((v,x)=>{const px=BX+x*(CS+G),py=BY+y*(CS+G);
      let s=1;if(pop&&pop.x===x&&pop.y===y){const k=(now-pop.t)/150;if(k<1)s=.6+.4*k}
      const w=CS*s,o=(CS-w)/2;cx.fillStyle=v?col(v):C.dim;cx.fillRect(px+o,py+o,w,w);
      if(v){cx.fillStyle=Math.log2(v)>6?'#081330':C.fg;cx.textAlign='center';const nm=NAME[v]||v;cx.font=`${String(nm).length>4?13:16}px "Do Hyeon"`;cx.fillText(nm,px+CS/2,py+CS/2+2);
        cx.font='8px "Press Start 2P"';cx.fillText(v,px+CS/2,py+CS-10)}}));
    cx.textAlign='left';cx.fillStyle=C.alt;cx.font='9px "Press Start 2P"';cx.fillText('LADDER',512,84);
    Object.entries(NAME).slice(0,9).forEach(([v,n],i)=>{cx.fillStyle=+v<=best?C.hi:'#4D5F8C';cx.font='13px "Do Hyeon"';cx.fillText(`${+v<=best?'●':'○'} ${n}`,512,108+i*22)});
    cx.fillStyle=C.alt;cx.font='9px "Press Start 2P"';cx.fillText('BEST',16,84);cx.fillStyle=C.hi;cx.font='20px "Do Hyeon"';cx.fillText(NAME[best]||best,16,112);
    hud(score,left);
    if(left<=0||q||!canMove()){ended=true;done(score,`최고 단계 ${NAME[best]||best}`);return false}
  });
  return{quit(){q=true},stop,dir:move,key(k,down){if(down&&DIRS[k])move(DIRS[k])}};
}

/* --- 게임 5: 교무실 탈출 (팩맨형) --- */
function makeMaze(done){
  let q=false;const MAP=['####################','#o.......##.......o#','#.##.###.##.###.##.#','#..................#','#.##.#.######.#.##.#','#....#...GG...#....#','####.###.##.###.####','#........P.........#','#.##.###.##.###.##.#','#o.......##.......o#','####################'];
  const CS=30,OX=20,OY=55,DUR=dur(75),V={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]},opp={L:'R',R:'L',U:'D',D:'U'};
  let dots,score=0,lives=3,eaten=0,fright=0,el=0;
  const walk=(x,y)=>MAP[y]&&MAP[y][x]&&MAP[y][x]!=='#';
  const fill=()=>{dots={};MAP.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='.'||c==='o')dots[x+','+y]=c}))};fill();
  const home=[[9,5],[10,5]],pl={x:9,y:7,tx:9,ty:7,t:0,mv:false,dir:'L',next:'L'};
  const gh=[{name:'공문',c:C.warn},{name:'민원',c:C.alt}].map((g,i)=>({...g,x:home[i][0],y:home[i][1],tx:home[i][0],ty:home[i][1],t:0,mv:false,dir:'U'}));
  const reset=()=>{Object.assign(pl,{x:9,y:7,tx:9,ty:7,t:0,mv:false});gh.forEach((g,i)=>Object.assign(g,{x:home[i][0],y:home[i][1],tx:home[i][0],ty:home[i][1],t:0,mv:false}))};
  const rp=e=>[e.x+(e.tx-e.x)*e.t,e.y+(e.ty-e.y)*e.t];
  const step=(e,sp,dt,choose,arrive)=>{if(!e.mv){const d=choose(e);if(!d)return;e.dir=d;e.tx=e.x+V[d][0];e.ty=e.y+V[d][1];e.mv=true;e.t=0}
    e.t+=sp*dt;if(e.t>=1){e.x=e.tx;e.y=e.ty;e.t=0;e.mv=false;arrive&&arrive(e)}};
  const stop=runLoop((dt,now)=>{
    el+=dt;const left=Math.max(0,DUR-el);fright=Math.max(0,fright-dt);
    step(pl,7,dt,e=>{const ok=d=>walk(e.x+V[d][0],e.y+V[d][1]);return ok(e.next)?e.next:ok(e.dir)?e.dir:null},e=>{
      const k=e.x+','+e.y;if(dots[k]){if(dots[k]==='o'){fright=6;score+=30;sfx('perfect')}else score+=10;eaten++;delete dots[k];
        if(!Object.keys(dots).length){score+=200;fill();sfx('record')}}});
    gh.forEach(g=>step(g,fright?3.2:4.6,dt,e=>{
      const opts=Object.keys(V).filter(d=>walk(e.x+V[d][0],e.y+V[d][1]));let c=opts.filter(d=>d!==opp[e.dir]);if(!c.length)c=opts;
      if(Math.random()<.25)return pick(c);
      const sc=d=>{const nx=e.x+V[d][0],ny=e.y+V[d][1];return(nx-pl.x)**2+(ny-pl.y)**2};
      return c.sort((a,b)=>fright?sc(b)-sc(a):sc(a)-sc(b))[0]}));
    const[px,py]=rp(pl);
    for(const g of gh){const[gx,gy]=rp(g);if(Math.hypot(gx-px,gy-py)<.6){
      if(fright){score+=50;sfx('great');const i=gh.indexOf(g);Object.assign(g,{x:home[i][0],y:home[i][1],tx:home[i][0],ty:home[i][1],t:0,mv:false})}
      else{lives--;sfx('miss');reset();break}}}
    clear();
    MAP.forEach((r,y)=>[...r].forEach((c,x)=>{const X=OX+x*CS,Y=OY+y*CS;
      if(c==='#'){cx.fillStyle=C.wall;cx.fillRect(X+2,Y+2,CS-4,CS-4)}
      const d=dots[x+','+y];if(d==='.'){cx.fillStyle=C.fg;cx.fillRect(X+CS/2-2,Y+CS/2-2,4,4)}
      if(d==='o'){cx.fillStyle=C.hi;cx.fillRect(X+9,Y+9,12,13);cx.strokeStyle=C.hi;cx.lineWidth=2;cx.beginPath();cx.arc(X+22,Y+15,4,-1.4,1.4);cx.stroke()}}));
    const ang={R:0,D:Math.PI/2,L:Math.PI,U:-Math.PI/2}[pl.dir],mouth=.25+.2*Math.abs(Math.sin(now/90));
    cx.fillStyle=C.hi;cx.beginPath();cx.moveTo(OX+px*CS+CS/2,OY+py*CS+CS/2);cx.arc(OX+px*CS+CS/2,OY+py*CS+CS/2,12,ang+mouth,ang-mouth+Math.PI*2);cx.fill();
    gh.forEach(g=>{const[gx,gy]=rp(g),X=OX+gx*CS,Y=OY+gy*CS;cx.fillStyle=fright?(fright<2&&Math.floor(now/150)%2?C.fg:'#3A5BA8'):g.c;
      cx.beginPath();cx.arc(X+CS/2,Y+CS/2-2,12,Math.PI,0);cx.lineTo(X+CS/2+12,Y+CS/2+12);cx.lineTo(X+CS/2-12,Y+CS/2+12);cx.fill();
      cx.fillStyle='#081330';cx.font='bold 10px "IBM Plex Sans KR"';cx.textAlign='center';cx.fillText(fright?'퇴근':g.name,X+CS/2,Y+CS/2+5)});
    for(let i=0;i<3;i++){cx.fillStyle=i<lives?C.hi:C.dim;cx.beginPath();cx.arc(22+i*20,30,6,0,7);cx.fill()}
    cx.fillStyle=C.alt;cx.font='10px "Press Start 2P"';cx.textAlign='left';cx.fillText(`ATTEND ${eaten}`,90,34);
    hud(score,left,fright?'COFFEE':'');
    if(lives<=0||left<=0||q){done(score,`출석 도장 ${eaten}개`);return false}
  });
  return{quit(){q=true},stop,dir(d){pl.next=d},key(k,down){if(down&&DIRS[k])pl.next=DIRS[k]}};
}

function setFs(on){
  const c=$('#console');if(!c)return;const was=c.classList.contains('fs');

  const b=$('#fsBtn');if(b){b.setAttribute('aria-pressed',on);$('#fsTxt').textContent=on?'전체화면 닫기':'전체화면'}
  if(on&&!was){try{const de=document.documentElement,r=de.requestFullscreen&&de.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
  if(!on&&was&&document.fullscreenElement){try{document.exitFullscreen().catch(()=>{})}catch(e){}}

const PINS={staff:'1111',admin:'0000'};
const unlocked={staff:false,admin:false};

let lockCtx=null,lockVal='';
const LOCK_TXT={staff:['STAFF ONLY','스태프 화면','현장 스태프용 화면이에요. 스태프 PIN 4자리를 입력해 주세요.','1111'],

      <p class="lock-msg" id="lockMsg"></p>

function hideLock(){$('#lock').hidden=true;$('#lock').innerHTML='';lockCtx=null;document.body.style.overflow=''}
function paintDots(err){const d=$('#pinDots');if(!d)return;d.querySelectorAll('i').forEach((i,k)=>i.classList.toggle('on',k<lockVal.length));
  d.classList.remove('err');if(err){void d.offsetWidth;d.classList.add('err')}}
function lockKey(k){
  if(!lockCtx)return;
  if(k==='del')lockVal=lockVal.slice(0,-1);else if(k==='clr')lockVal='';else if(lockVal.length<4)lockVal+=k;
  $('#lockMsg').textContent='';paintDots();
  if(lockVal.length===4){
    const{trk,t}=lockCtx;
    if(lockVal===PINS[trk]){unlocked[trk]=true;if(trk==='admin')adminOk=true;
      if(trk==='staff'){try{sessionStorage.setItem('szone-staff','1')}catch(e){}}
      setTimeout(()=>{hideLock();enterTrack(trk,t);window.scrollTo({top:0})},180)}
    else{lockVal='';setTimeout(()=>{paintDots(true);$('#lockMsg').textContent='PIN이 맞지 않아요. 다시 입력해 주세요.'},120)}
  }
}
document.addEventListener('keydown',e=>{if(!lockCtx)return;
  if(/^[0-9]$/.test(e.key)){e.preventDefault();lockKey(e.key)}
  else if(e.key==='Backspace'){e.preventDefault();lockKey('del')}
  else if(e.key==='Escape'){hideLock();openIntro()}});

function startParticles(){
  cancelAnimationFrame(introRAF);
  const cv=$('#pcv');if(!cv)return;const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=Math.min(760,cv.parentElement.clientWidth),H=Math.round(W*(W<500?.42:.3));
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d',{willReadFrequently:true});
  let fs=H*.78;o.font=`${fs}px "Do Hyeon"`;const t1='AI-e',t2='랩';
  const tw=o.measureText(t1+t2).width;if(tw>W*.94){fs*=W*.94/tw;o.font=`${fs}px "Do Hyeon"`}
  const w1=o.measureText(t1).width,w2=o.measureText(t2).width,x0=(W-w1-w2)/2;
  o.textBaseline='middle';o.fillStyle='#f00';o.fillText(t1,x0,H/2+fs*.04);o.fillStyle='#0f0';o.fillText(t2,x0+w1,H/2+fs*.04);
  const d=o.getImageData(0,0,W,H).data,step=Math.max(3,Math.round(W/230)),P=[];
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){const i=(y*W+x)*4;if(d[i+3]>140){const teal=d[i+1]>d[i];
    const a=Math.random()*Math.PI*2,r=W*.25+Math.random()*W*.6;
    P.push({tx:x,ty:y,x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r*.6,vx:0,vy:0,teal,s:Math.random()<.15?2.2:1.6,tw:Math.random()*6})}}
  const still=reduced();if(still)P.forEach(p=>{p.x=p.tx;p.y=p.ty});
  let mx=-999,my=-999,t0=performance.now();
  const host=$('#intro');
  const mv=e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width);my=(e.clientY-r.top)*(H/r.height)};
  const lv=()=>{mx=my=-999};
  host.addEventListener('pointermove',mv);host.addEventListener('pointerdown',mv);host.addEventListener('pointerleave',lv);host.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')lv()});
  introOff=()=>{host.removeEventListener('pointermove',mv);host.removeEventListener('pointerdown',mv);host.removeEventListener('pointerleave',lv)};
  const R=Math.max(50,W*.09);
  const frame=now=>{
    if(host.hidden)return;const el=(now-t0)/1000,k=Math.min(.085,.012+el*.05),swirl=Math.max(0,1-el/1.4);
    g.clearRect(0,0,W,H);
    for(const p of P){
      if(!still){
        let ax=(p.tx-p.x)*k,ay=(p.ty-p.y)*k;
        if(swirl){const dx=p.x-W/2,dy=p.y-H/2;ax+=-dy*.02*swirl;ay+=dx*.02*swirl}
        const qx=p.x-mx,qy=p.y-my,q2=qx*qx+qy*qy;
        if(q2<R*R){const q=Math.sqrt(q2)||1,f=(R-q)/R*7;ax+=qx/q*f;ay+=qy/q*f}
        p.vx=(p.vx+ax)*.82;p.vy=(p.vy+ay)*.82;p.x+=p.vx;p.y+=p.vy;
      }
    }
    const tw=now/600;
    g.fillStyle='#FFFFFF';for(const p of P)if(!p.teal){g.globalAlpha=.72+.28*Math.sin(tw+p.tw);g.fillRect(p.x,p.y,p.s,p.s)}
    g.fillStyle='#45F0CF';for(const p of P)if(p.teal){g.globalAlpha=.8+.2*Math.sin(tw+p.tw);g.fillRect(p.x,p.y,p.s,p.s)}
    g.globalAlpha=1;
    if(!still)introRAF=requestAnimationFrame(frame);
  };
  introRAF=requestAnimationFrame(frame);
}
function decodeText(el,text){
  if(!el)return;if(reduced()){el.textContent=text;return}
  const G='가나다라마바사아자차카타파하ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#+*';let f=0;const N=26;
  const iv=setInterval(()=>{f++;el.textContent=[...text].map((ch,i)=>ch===' '||i<f/N*text.length?ch:G[Math.floor(Math.random()*G.length)]).join('');
    if(f>=N){clearInterval(iv);el.textContent=text}},45);introTimers.push(iv);
}
function typeLoop(){
  const el=$('#pText');if(!el)return;if(reduced()){el.textContent=PROMPTS[0];return}
  const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const syl=(c,j,k)=>String.fromCharCode(0xAC00+(c*21+j)*28+k);
  const frames=t=>{const out=[];let done='',prev=null;
    for(const ch of t){const n=ch.charCodeAt(0)-0xAC00;
      if(n>=0&&n<11172){const c=Math.floor(n/588),j=Math.floor(n%588/28),k=n%28,asJong=JONG.indexOf(CHO[c]);
        if(prev&&prev.k===0&&asJong>0)out.push(done.slice(0,-1)+syl(prev.c,prev.j,asJong));
        else out.push(done+CHO[c]);
        out.push(done+syl(c,j,0));if(k)out.push(done+syl(c,j,k));
        done+=ch;prev={c,j,k}}
      else{done+=ch;prev=null;out.push(done)}}
    return out};
  const show=s=>{el.innerHTML=s?esc(s.slice(0,-1))+`<span class="p-new">${esc(s.slice(-1))}</span>`:''};
  let i=0;
  const run=()=>{if(!el.isConnected)return;const f=frames(PROMPTS[i]);let k=0;
    const typ=()=>{if(!el.isConnected)return;show(f[k]);k++;
      if(k<f.length){introTimers.push(setTimeout(typ,f[k-1].endsWith(' ')?40:55+Math.random()*70))}
      else introTimers.push(setTimeout(del,1900))};
    let cur=PROMPTS[i];

      if(cur.length)introTimers.push(setTimeout(del,28));else{i=(i+1)%PROMPTS.length;introTimers.push(setTimeout(run,320))}};

  introTimers.push(setTimeout(run,450));
}

function bindCabSeg(){document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{cabView=b.dataset.cv;renderCabinet();window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'})})}
function bookText(){
  const ws=allWorries(),ok=S.comforts.filter(c=>c.ok),out=['선생님이 선생님에게 — 2026 AI-e랩 연구 응원 모음집',''];
  ws.forEach(w=>{const c=ok.filter(x=>x.wid===w.id);if(!c.length)return;out.push(`[${w.cat}] ${w.text}`);c.forEach(x=>out.push(`  · "${x.text}" (${x.to==='self'?'나에게':'이 고민의 선생님께'})`));out.push('')});
  return out.join('\n');
}
function renderBook(){
  const v=$('#view-cabinet'),ws=allWorries(),ok=S.comforts.filter(c=>c.ok);
  const chapters=ws.map(w=>({w,c:ok.filter(c=>c.wid===w.id)})).filter(x=>x.c.length);
  const cats=['전체',...CATS.filter(c=>chapters.some(x=>x.w.cat===c)),'나에게 쓴 연구 응원'];
  if(!cats.includes(bookCat))bookCat='전체';
  const feat=ok.length?ok[featIdx%ok.length]:null,fw=feat&&ws.find(w=>w.id===feat.wid);
  const q=(x,i,showW)=>`<figure class="quote paper-${x.paper||1}"><blockquote>${esc(x.text)}</blockquote><figcaption>${x.to==='self'?'나에게 쓴 연구 응원':'이 고민의 선생님께'}${showW?` · ${esc(ws.find(w=>w.id===x.wid)?.text||'')}`:''}</figcaption></figure>`;
  let body;
  if(bookCat==='나에게 쓴 연구 응원'){const c=ok.filter(x=>x.to==='self');
    body=`<section class="chapter"><div class="ch-head"><span class="ch-no">${ic('heart',30)}</span><div><span class="tag teal">특별 장</span><h3>나에게 쓴 연구 응원</h3><p class="small muted">고민을 읽고 스스로에게 건넨 문장 ${c.length}개</p></div></div>
      <div class="quotes">${c.map((x,i)=>q(x,i,true)).join('')||'<p class="small muted">아직 없어요.</p>'}</div></section>`}
  else body=chapters.filter(x=>bookCat==='전체'||x.w.cat===bookCat).map(({w,c})=>{const n=chapters.findIndex(x=>x.w===w)+1;
    return `<section class="chapter" id="ch-${w.id}"><div class="ch-head"><span class="ch-no">${String(n).padStart(2,'0')}</span><div><span class="tag blue">${w.cat}</span><h3>${esc(w.text)}</h3>
      <p class="small muted">공감 ${(w.metoo||0)+(S.metoo[w.id]?1:0)} · 연구 응원 ${c.length}장</p></div></div><div class="quotes">${c.map((x,i)=>q(x,i)).join('')}</div></section>`}).join('');
  v.innerHTML=`${cabSeg()}
  <article class="book">
    <header class="book-cover">
      <p class="bc-eye">2026 AI-e LAB RESEARCH · 연구 응원 모음집</p>
      <h2 class="bc-title">선생님이<br>선생님에게</h2>
      <p class="bc-meta">고민 ${chapters.length}편 · 연구 응원 ${ok.length}장 · DAY 1–${S.day}에 모인 문장들</p>
      ${feat?`<figure class="bc-feat"><p class="bc-eye" style="color:#45F0CF">오늘의 한 문장</p><blockquote>${esc(feat.text)}</blockquote>
        <figcaption>"${esc(fw?fw.text:'')}"에 남긴 연구 응원</figcaption><button id="nextFeat">다른 문장 보기</button></figure>`:''}
    </header>
    <nav class="chips" aria-label="장 고르기">${cats.map(c=>`<button class="chip" data-bc="${c}" aria-pressed="${c===bookCat}">${c}</button>`).join('')}</nav>
    ${body||'<div class="empty">아직 공개된 연구 응원가 없어요. 연구 사례 카드에서 첫 연구 응원를 넣어 주세요.</div>'}
    <footer class="book-foot">
      <p class="small muted">운영진이 확인한 문장만 실려요. 행사가 끝나면 이 모음집을 PDF와 카드뉴스로 엮어 참여한 모든 선생님께 나눠 드려요.</p>
      <div class="row"><button class="btn" id="bookCopy">전체 문장 복사</button>${track==='staff'?'<button class="btn ghost" id="bookBoard">부스 화면에서 보기</button>':''}<button class="btn ghost" id="bookWrite">나도 연구 응원 넣으러 가기</button></div>
      <textarea id="bookOut" rows="5" readonly hidden style="width:100%;font-size:12px"></textarea>
    </footer>
  </article>`;
  bindCabSeg();
  document.querySelectorAll('[data-bc]').forEach(b=>b.onclick=()=>{bookCat=b.dataset.bc;renderBook()});
  const nf=$('#nextFeat');if(nf)nf.onclick=()=>{featIdx++;renderBook()};
  $('#bookCopy').onclick=()=>{const t=bookText(),ta=$('#bookOut');ta.value=t;ta.hidden=false;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('모음집 문장을 복사했어요')).catch(()=>{ta.select();toast('아래 칸을 선택해 복사해 주세요')})};
  const bbd=$('#bookBoard');if(bbd)bbd.onclick=()=>{bIdx=SLIDES.findIndex(s=>s[0]==='comfort');setTab('board')};
  $('#bookWrite').onclick=()=>{cabView='lockers';renderCabinet()};
}

/* ================= 큰 글씨 · 고대비 ================= */
function applyA11y(){const r=document.documentElement;r.classList.toggle('big',!!S.a11y.big);r.classList.toggle('hc',!!S.a11y.hc);
  document.querySelectorAll('[data-a11y]').forEach(b=>b.setAttribute('aria-pressed',!!S.a11y[b.dataset.a11y]));drawPuzzle()}
$('#a11yBtn').onclick=e=>{e.stopPropagation();const p=$('#a11yPop');p.hidden=!p.hidden;$('#a11yBtn').setAttribute('aria-expanded',!p.hidden)};
document.querySelectorAll('[data-a11y]').forEach(b=>b.onclick=()=>{const k=b.dataset.a11y;S.a11y[k]=!S.a11y[k];save();applyA11y();
  toast(k==='big'?(S.a11y.big?'큰 글씨로 바꿨어요':'기본 글씨로 돌아왔어요'):(S.a11y.hc?'고대비로 바꿨어요':'기본 대비로 돌아왔어요'))});
document.addEventListener('click',e=>{if(!e.target.closest('.a11y')){$('#a11yPop').hidden=true;$('#a11yBtn').setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#a11yPop').hidden){$('#a11yPop').hidden=true;$('#a11yBtn').focus()}});

/* ================= 키오스크 ================= */
function applyKiosk(){document.body.classList.toggle('kiosk',!!S.kiosk);$('#stLabel').textContent=`게임 스테이션 ${S.station}`;$('#kioskBar').hidden=!S.kiosk;$('#kioskForm').hidden=true;$('#kioskExit').hidden=false;
  if(S.kiosk&&(track!=='staff'||!['arcade','board'].includes(tab)))enterTrack('staff','arcade')}
$('#kioskExit').onclick=()=>{$('#kioskExit').hidden=true;$('#kioskForm').hidden=false;$('#kioskPin').value='';$('#kioskPin').focus()};
$('#kioskForm').onsubmit=e=>{e.preventDefault();if($('#kioskPin').value==='0000'){S.kiosk=false;save();applyKiosk();toast('공용 게임 스테이션 모드를 해제했어요');openIntro()}else{toast('PIN이 맞지 않아요');applyKiosk()}};
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{if(S.kiosk&&tab==='arcade'&&!inst&&!counting&&(lastResult||!$('#howto').hidden)&&Date.now()-lastAct>60000){
  lastResult=null;$('#arcadeResult').hidden=true;closeHow();stopGame();renderArcade()}},5000);

/* ================= 시작 ================= */
function fromHash(){
  const h=location.hash.slice(1);
  if(!h)return;
  if(h.startsWith('qr-')){enterTrack('participant','pass');scanZone(h.slice(3))}
  else if(h==='stamp-arcade'){enterTrack('participant','pass');if(giveStamp('arcade'))renderPass()}
  else if(h==='staff'||h==='admin'||h==='join')enterTrack(h==='join'?'participant':h);
  else if(TABS.includes(h)){if(!ALLOW[track].includes(h))enterTrack(ALLOW.participant.includes(h)?'participant':ALLOW.staff.includes(h)?'staff':'admin',h);else setTab(h)}
}
window.addEventListener('hashchange',fromHash);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>drawPuzzle());
new MutationObserver(()=>drawPuzzle()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{drawArt();drawPuzzle();if(tab==='arcade'&&!inst&&!lastResult&&!counting&&$('#howto').hidden)idleScreen()});
applyA11y();drawArt();enterTrack(S.kiosk?'staff':'participant',S.kiosk?'arcade':null);applyKiosk();if(!S.kiosk&&!location.hash)openIntro();fromHash();
</script>

</body></html>
