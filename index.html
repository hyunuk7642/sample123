<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI-e랩 패스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: 서울시교육청 파랑 헤더 + 청록 점 포인트. 종이 카드 위 2단(폰 1단). 아케이드만 남색 CRT 고정색. */
:root{
  --paper:#F1F5FB; --card:#FFFFFF; --ink:#102040; --muted:#536079; --line:#D2DBEA; --soft:#E4ECF7;
  --head:#0257A6; --head-ink:#F5F9FF; --blue:#0257A6; --blue-soft:#DCE8F7; --teal:#029987; --teal-soft:#D5F0EB; --warn:#C8452F; --warn-soft:#FBE4DF;
  --n1:#DCE8FF; --n2:#D3F1EA; --n3:#FFF0C7; --n4:#FBE0E7;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-pixel:"Press Start 2P",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B1426; --card:#121D35; --ink:#E4EBF8; --muted:#96A3BD; --line:#24324F; --soft:#19253F;
  --head:#063F7C; --head-ink:#F5F9FF; --blue:#5B9BEA; --blue-soft:#1A2D52; --teal:#2EC4A8; --teal-soft:#123A36; --warn:#F07A63; --warn-soft:#3B201E;
  --n1:#1F3260; --n2:#173F3A; --n3:#433A20; --n4:#45263A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1426; --card:#121D35; --ink:#E4EBF8; --muted:#96A3BD; --line:#24324F; --soft:#19253F;
  --head:#063F7C; --head-ink:#F5F9FF; --blue:#5B9BEA; --blue-soft:#1A2D52; --teal:#2EC4A8; --teal-soft:#123A36; --warn:#F07A63; --warn-soft:#3B201E;
  --n1:#1F3260; --n2:#173F3A; --n3:#433A20; --n4:#45263A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}

.top{background:var(--head);color:var(--head-ink);padding:18px 16px 0}
.top-in{max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand .dot{width:14px;height:14px;border-radius:50%;background:#029987;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.brand h1{font-size:30px}
.brand span{font-size:13px;opacity:.82}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;color:var(--head-ink);opacity:.78;padding:10px 14px 12px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);opacity:1}
.demo{max-width:1040px;margin:12px auto 0;padding-inline:16px;font-size:12.5px;color:var(--muted)}
main{max-width:1040px;margin:0 auto;padding:12px 16px 72px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.stack{display:grid;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
:root .btn{color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.teal{background:var(--teal);border-color:var(--teal)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.teal{background:var(--teal-soft);color:var(--teal)}
.nameplate{font-family:var(--f-display);font-size:22px;overflow-wrap:anywhere}
.nameplate b{font-weight:400;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:780px){.cols{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--card)}

/* 패스 */
canvas#puzzle{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:10px;display:block;background:var(--soft)}
.progress{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.done-banner{border:2px solid var(--teal);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stamp{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:50%;display:grid;place-items:center;text-align:center;padding:8px;font-size:13px;color:var(--muted);max-width:100%}
.stamp.on{border:3px solid var(--blue);color:var(--blue);transform:rotate(-8deg);font-family:var(--f-display);font-size:17px;line-height:1.15}
.stamp.on small{display:block;font-family:var(--f-body);font-size:11px;margin-top:2px}
.ticket{border:2px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ticket .no{font-family:var(--f-pixel);font-size:16px;letter-spacing:.04em;color:var(--blue)}
.ticket.win{background:var(--teal);border-color:var(--teal);color:#fff}
.ticket.win .no{color:#fff}
.codebox{font-family:var(--f-pixel);font-size:22px;letter-spacing:.12em;color:var(--blue)}
.qr-chips{display:flex;flex-wrap:wrap;gap:8px}
.qr-chips button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13.5px}
.qr-chips button[data-done="1"]{border-color:var(--teal);color:var(--teal)}
.badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--teal);color:var(--teal);border-radius:99px;padding:4px 12px;font-family:var(--f-display);font-size:16px}

/* 아케이드 */
.carts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:960px){.carts{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:520px){.carts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cart{position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px 10px 4px 4px;padding:14px 12px 12px;cursor:pointer;display:grid;gap:4px;min-width:0}
.cart::before{content:"";position:absolute;left:12px;right:12px;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.cart b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.2}
.cart span{font-size:12.5px;color:var(--muted)}
.cart[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.cart .hot{position:absolute;top:10px;right:10px}
.arcade{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.arcade{grid-template-columns:1fr}}
.cabinet{background:#081330;border-radius:16px;padding:12px;border:4px solid #1B2D5C;color:#E6EEFF;display:grid;gap:10px}
.cab-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.cab-head b{font-family:var(--f-display);font-weight:400;font-size:20px}
.cab-head span{color:#8FB2FF}
canvas#ac{width:100%;max-width:100%;aspect-ratio:16/10;display:block;border-radius:8px;background:#081330;touch-action:none}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrls .grow{flex:1;min-width:0}
.ac-in{width:100%;background:#0F1E45;border:2px solid #2A3C6B;color:#E6EEFF;border-radius:8px;padding:10px 12px;font-size:17px}
.ac-in:focus{border-color:#5FE0C8;outline:none}
.ac-btn{background:#5FE0C8;border:0;color:#081330;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}
.ac-btn:disabled{opacity:.5;cursor:not-allowed}
.pad{display:flex;gap:6px}
.pad button{width:44px;height:44px;border-radius:8px;border:2px solid #2A3C6B;background:#0F1E45;color:#E6EEFF;font-size:18px;cursor:pointer}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--card);border-color:var(--blue)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lb .rk{font-family:var(--f-pixel);font-size:11px;color:var(--muted)}
.lb li:nth-child(1) .rk{color:var(--teal)}
.lb .who{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere}
.lb .who b{font-weight:400;color:var(--muted)}
.lb .sc{font-family:var(--f-pixel);font-size:12px;font-variant-numeric:tabular-nums}
.lb li.me{background:var(--blue-soft);border-radius:8px;padding-inline:6px}
.pseudoqr{width:120px;height:120px;image-rendering:pixelated;background:#fff;border-radius:6px;padding:6px;max-width:100%;flex:none}

/* 고민 사물함 */
.lockers{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.locker{position:relative;border:2px solid var(--line);background:var(--soft);border-radius:8px;min-height:200px;padding:28px 12px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0}
.locker::before{content:"";position:absolute;top:10px;left:12px;right:40px;height:9px;background:repeating-linear-gradient(90deg,var(--line) 0 16px,transparent 16px 22px);border-radius:2px}
.locker::after{content:"";position:absolute;top:9px;right:12px;width:18px;height:11px;border-radius:3px;background:var(--line)}
.locker .note{background:var(--card);border:1px solid var(--line);padding:9px;font-size:13.5px;line-height:1.45;transform:rotate(-1.2deg);border-radius:2px}
.locker .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.locker .no{font-family:var(--f-pixel);font-size:10px}
.locker[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.inside{border:2px solid var(--blue);border-radius:var(--r);background:var(--card);overflow:hidden;animation:open .35s ease-out}
@keyframes open{from{opacity:0;transform:perspective(900px) rotateY(-14deg);transform-origin:left}to{opacity:1;transform:none}}
.inside-head{background:var(--blue-soft);padding:18px;display:grid;gap:10px}
.inside-body{padding:18px;display:grid;gap:22px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.steps div{background:var(--soft);border-radius:10px;padding:12px;font-size:14px;min-width:0}
.steps b{display:block;font-size:12px;color:var(--blue);margin-bottom:4px;letter-spacing:.06em}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.res-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.res-card canvas{width:64px;height:64px;image-rendering:pixelated;background:#fff;border-radius:4px;padding:3px;flex:none}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sticky{padding:14px 12px 12px;border-radius:3px;font-size:14px;line-height:1.5;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transform:rotate(var(--rot,0deg));box-shadow:0 1px 0 var(--line)}
.sticky .to{font-size:11.5px;color:var(--muted)}
.paper-1{background:var(--n1)} .paper-2{background:var(--n2)} .paper-3{background:var(--n3)} .paper-4{background:var(--n4)}
.swatches{display:flex;gap:8px}
.swatches label{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:block}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches input:checked + label{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.swatches input:focus-visible + label{outline:3px solid var(--teal);outline-offset:2px}
.metoo{border:1px solid var(--blue);color:var(--blue);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px}
.metoo[aria-pressed="true"]{background:var(--blue);color:var(--card)}
.count{font-size:12px;color:var(--muted);text-align:right}

/* 네트워킹 */
.mycode{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.table-card{border:1px solid var(--line);background:var(--card);border-radius:60px 60px 14px 14px;padding:20px 16px 14px;text-align:center;cursor:pointer;display:grid;gap:8px;justify-items:center;min-width:0}
.table-card small{font-family:var(--f-pixel);font-size:10px;color:var(--muted)}
.table-card b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.3}
.table-card[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset;background:var(--blue-soft)}
.seats{display:flex;gap:4px}
.seats i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--blue)}
.seats i.on{background:var(--blue)}
.deck{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:700px){.deck{grid-template-columns:1fr}}
.qbig{background:var(--blue);color:#fff;border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:190px}
.qbig p{font-family:var(--f-display);font-size:26px;line-height:1.3;text-wrap:balance}
.qbig .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.9;gap:8px;flex-wrap:wrap}
.qbig button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600}
.timer{display:grid;justify-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:16px}
.timer svg{width:140px;height:140px;max-width:100%}
.timer .t{font-family:var(--f-pixel);font-size:18px;fill:var(--ink)}
.met{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.met li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.met .memo{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.found{border:2px dashed var(--teal);border-radius:10px;padding:12px;display:grid;gap:10px}

/* 운영자 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--card)}
.tile b{display:block;font-family:var(--f-pixel);font-size:18px;margin-top:6px;font-variant-numeric:tabular-nums}
.tile.warn{border-color:var(--warn)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--blue)}
.bar.t .track i{background:var(--teal)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.slot{font-family:var(--f-pixel);font-size:clamp(20px,6vw,38px);text-align:center;padding:22px 10px;background:#081330;color:#5FE0C8;border-radius:12px;letter-spacing:.06em}
.list-plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list-plain li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:14px}
.list-plain li > div{min-width:0}
.scroll{max-height:320px;overflow:auto}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);font-weight:600;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- 공통 보강 ---- */
.ic{flex:none;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.big{padding:13px 18px;font-size:16px}
.bub{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.bub.big{width:52px;height:52px;border-radius:16px}
.sec-h{font-size:21px;display:flex;align-items:center;gap:8px}
.sec-h .ic{color:var(--blue)}

/* ---- 패스: 온보딩 ---- */
.onb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:780px){.onb{grid-template-columns:1fr}}
.onb-art{background:linear-gradient(150deg,#0257A6,#0B3F7A);color:#fff;border-radius:18px;padding:26px 22px;display:grid;gap:18px;align-content:start;position:relative;overflow:hidden}
.onb-art::after{content:"";position:absolute;right:22px;top:22px;width:22px;height:22px;border-radius:50%;background:#029987}
.onb-art h2{font-size:32px;line-height:1.2}
.onb-steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.onb-steps li{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.1);border-radius:12px;padding:12px}
.onb-steps .bub{background:rgba(255,255,255,.16);color:#fff}
.onb-steps div{display:grid;min-width:0}
.onb-steps span{font-size:13px;opacity:.82}
.preview-plate{background:var(--blue-soft);border-radius:10px;padding:10px 14px;display:grid;gap:2px}

/* ---- 패스: 히어로 ---- */
.passhero{background:linear-gradient(135deg,#0257A6 0%,#094C93 55%,#0B3F7A 100%);color:#fff;border-radius:20px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;position:relative;overflow:hidden}
.passhero::before{content:"";position:absolute;left:-60px;bottom:-90px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.passhero::after{content:"";position:absolute;right:18px;top:16px;width:16px;height:16px;border-radius:50%;background:#029987}
.ph-main{display:grid;gap:8px;min-width:0;position:relative}
.ph-eye{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em;opacity:.8;line-height:1.6}
.ph-name{font-family:var(--f-display);font-size:clamp(24px,5vw,32px);line-height:1.2;overflow-wrap:anywhere}
.ph-name b{font-weight:400;opacity:.55}
.ph-chips{display:flex;gap:8px;flex-wrap:wrap}
.ph-chips span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-size:13px}
.ph-chips b{font-family:var(--f-pixel);font-size:12px;font-weight:400;letter-spacing:.08em}
.ph-chips .gold{background:#029987}
.ph-ring{position:relative}
@media (max-width:520px){.passhero{grid-template-columns:1fr}.ph-ring{justify-self:start}}

.next{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--blue);border-radius:14px;padding:12px 14px}
.next p{flex:1;min-width:200px}
.next b{color:var(--blue)}

.journey{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.journey{grid-template-columns:1fr}}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-width:0}
.step .step-txt{display:grid;min-width:0}
.step b{font-family:var(--f-display);font-weight:400;font-size:18px}
.step .mini{grid-column:1/-1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.step .mini i{display:block;height:100%;background:var(--blue);border-radius:99px}
.step.done{border-color:var(--teal)}
.step.done .bub{background:var(--teal);color:#fff}
.step.done .mini i{background:var(--teal)}
.step.now{border-color:var(--blue)}
.step.lock{opacity:.7}
.step.lock .bub{background:var(--soft);color:var(--muted)}

.zlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.zlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--paper)}
.zlist .zi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-pixel);font-size:9px;background:var(--blue-soft);color:var(--blue)}
.zlist .zt{display:grid;min-width:0}
.zlist .zt span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:3px}
.zlist li.done{background:var(--teal-soft)}
.zlist li.done .zi{background:var(--teal);color:#fff}

.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stile{display:grid;gap:4px;justify-items:center;text-align:center;border:1.5px dashed var(--line);background:var(--paper);border-radius:14px;padding:12px 8px;cursor:pointer;min-width:0}
.stile b{font-size:13.5px;font-weight:600}
.stile .go{font-size:12px;color:var(--blue);display:inline-flex;align-items:center;gap:2px;font-weight:600}
.stile.on{border:1.5px solid var(--blue);background:var(--blue-soft);cursor:default}
.stile .seal{width:66px;height:66px;border-radius:50%;border:3px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;line-height:1.05;transform:rotate(-10deg);padding:6px}

.lticket{display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--blue);color:#fff;border-radius:14px;overflow:hidden;position:relative}
.lticket .lt-main{padding:14px 16px;display:grid;gap:4px;min-width:0}
.lticket .lt-no{font-family:var(--f-pixel);font-size:18px;letter-spacing:.05em}
.lticket .lt-stub{padding:14px 18px;border-left:2px dashed rgba(255,255,255,.45);display:grid;place-items:center;gap:4px;text-align:center}
.lticket.win{background:#029987}
.lticket.lock{background:var(--paper);color:var(--ink);border:1.5px dashed var(--blue)}
.lticket.lock .lt-stub{border-left-color:var(--line);color:var(--blue)}
.lt-need b{color:var(--blue)}
.dots{display:flex;gap:6px;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--blue)}
.dots i.on{background:var(--blue)}
.locked{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:10px;padding:12px;color:var(--muted)}
.locked b{color:var(--ink)}

/* ---- 운영자 ---- */
.adm-login{max-width:400px;justify-items:start}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
#admClock{font-variant-numeric:tabular-nums}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subnav button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.subnav button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.subnav em{font-style:normal;background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi > div{display:grid;min-width:0}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.t .bub{background:var(--teal-soft);color:var(--teal)}
.kpi.m .bub{background:var(--blue-soft);color:var(--blue)}
.kpi.w{border-color:var(--warn)}
.kpi.w .bub{background:var(--warn-soft);color:var(--warn)}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alerts li{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 12px;background:var(--blue-soft)}
.alerts li p{flex:1;min-width:0;font-size:14px}
.alerts li .bub{width:32px;height:32px;border-radius:10px;background:var(--card)}
.alerts li.w{background:var(--warn-soft)}
.alerts li.w .bub{color:var(--warn)}
.bar.low .track i{background:var(--warn)}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.qitem{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start;background:var(--paper)}
.qitem .tag{justify-self:start}
.qtext{font-size:15px}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);padding:24px 12px;background:var(--paper);border-radius:12px}
.empty .ic{color:var(--teal)}
.slot{transition:transform .2s}
.slot.spin{transform:scale(1.03)}
.meter{display:grid;gap:8px}
.meter-n{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1}
.meter .track{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.meter .track i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.meter.m .track i{background:var(--blue)}
.meter.w .track i{background:var(--warn)}
.meter.w .meter-n{color:var(--warn)}
.lb li.hid{opacity:.45}
.daypick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.daypick button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 0;cursor:pointer;font-family:var(--f-display);font-size:24px;display:grid;justify-items:center;line-height:1.1}
.daypick small{font-family:var(--f-pixel);font-size:8px;color:var(--muted)}
.daypick button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.daypick button[aria-pressed="true"] small{color:rgba(255,255,255,.75)}

/* ---- 아케이드: 그만하기 ---- */
.ac-btn.quit{background:transparent;border:2px solid #FF8A73;color:#FFB4A5}

/* ---- 아케이드 보강 ---- */
.cab-head{align-items:center}
.cab-tools{display:flex;gap:6px;flex-wrap:wrap}
.cab-tool{background:#0F1E45;border:1px solid #2A3C6B;color:#C9D7FF;border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.cab-tool[aria-pressed="false"]{color:#7F8FB5}
.cab-tool:disabled{opacity:.45;cursor:not-allowed}
.ac-btn.ghost2{background:#0F1E45;border:2px solid #2A3C6B;color:#E6EEFF}
.howto{background:#0F1E45;border-radius:8px;padding:20px;display:grid;gap:14px;color:#E6EEFF}
.howto .eye{font-family:var(--f-pixel);font-size:9px;color:#5FE0C8;letter-spacing:.08em}
.howto h3{font-size:30px}
.howto ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.grade{width:100%;border-collapse:collapse;font-size:14px}
.grade td{padding:8px;border-top:1px solid #2A3C6B}
.grade td:first-child{font-family:var(--f-pixel);font-size:10px;white-space:nowrap}
.grade td:last-child{text-align:right;font-family:var(--f-pixel);font-size:11px;color:#E6EEFF;white-space:nowrap}
.g-P{color:#FFD66B}.g-G{color:#5FE0C8}.g-O{color:#8FB2FF}
.howto .tip{background:rgba(95,224,200,.1);border-radius:8px;padding:10px 12px;font-size:14px}
.howto .skip{display:flex;gap:8px;align-items:center;font-size:13.5px;color:#C9D7FF;cursor:pointer}
.tag.gold{background:#FFF1C4;color:#7A5600}

/* ---- 부스 화면 ---- */
.board{background:#081330;color:#E6EEFF;border-radius:18px;padding:22px clamp(16px,3vw,32px);display:grid;gap:18px;min-height:480px;grid-template-rows:auto 1fr auto;border:4px solid #1B2D5C}
.board:fullscreen{border-radius:0;border:0;padding:4vw;min-height:100vh;overflow:auto}
.b-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.b-brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:clamp(18px,2.4vw,26px)}
.b-brand .dot{width:14px;height:14px;border-radius:50%;background:#029987;flex:none}
.b-clock{font-family:var(--f-pixel);font-size:14px;color:#8FB2FF}
.b-slide{display:grid;gap:16px;align-content:start;animation:bfade .5s}
@keyframes bfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.b-eye{font-family:var(--f-display);font-size:clamp(30px,4.6vw,54px);color:#5FE0C8;line-height:1.1}
.b-sub{color:#8FB2FF;font-size:clamp(14px,1.6vw,18px)}
.b-rank{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.b-rank li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:#0F1E45;border-radius:12px;padding:10px 16px}
.b-rank .r{font-family:var(--f-pixel);font-size:18px;color:#8FB2FF}
.b-rank li:first-child{background:#123064;box-shadow:inset 0 0 0 2px #FFD66B}
.b-rank li:first-child .r{color:#FFD66B}
.b-rank .p,.b-game .p{font-family:var(--f-display);font-size:clamp(20px,3vw,34px);overflow-wrap:anywhere;line-height:1.2}
.b-rank .p b,.b-game .p b{font-weight:400;color:#6F82B0}
.b-rank .s{font-family:var(--f-pixel);font-size:clamp(13px,2vw,22px);color:#5FE0C8}
.b-new{display:inline-flex;align-items:center;background:#FFD66B;color:#081330;border-radius:99px;padding:7px 16px;font-family:var(--f-pixel);font-size:11px;line-height:1.6;justify-self:start;animation:blink 1s steps(2) infinite;overflow-wrap:anywhere}
@keyframes blink{50%{opacity:.6}}
.b-games{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.b-game{background:#0F1E45;border-radius:12px;padding:16px;display:grid;gap:6px;align-content:start}
.b-game .gn{font-size:14px;color:#8FB2FF}
.b-game .p{font-size:clamp(20px,2.4vw,28px)}
.b-game .s{font-family:var(--f-pixel);font-size:14px;color:#5FE0C8}
.b-bars{display:grid;gap:12px}
.b-bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 72px;gap:12px;align-items:center;font-family:var(--f-display);font-size:clamp(18px,2.4vw,28px)}
.b-bar .track{height:22px;background:#0F1E45;border-radius:6px;overflow:hidden}
.b-bar .track i{display:block;height:100%;background:linear-gradient(90deg,#1F4FA0,#5FE0C8)}
.b-bar .n{font-family:var(--f-pixel);font-size:14px;color:#5FE0C8;text-align:right}
.b-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.b-note{border-radius:4px;padding:16px;font-size:clamp(16px,1.8vw,22px);line-height:1.5;color:#0B1426;transform:rotate(var(--rot))}
.b-note.p1{background:#CFE0FF}.b-note.p2{background:#C8F0E5}.b-note.p3{background:#FFEDB8}.b-note.p4{background:#FBD9E2}
.b-note small{display:block;margin-top:8px;font-size:12px;opacity:.65}
.b-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.b-stat{background:#0F1E45;border-radius:14px;padding:18px;display:grid;gap:6px}
.b-stat b{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,6vw,76px);line-height:1;color:#fff}
.b-stat span{color:#8FB2FF;font-size:15px}
.b-draw{display:grid;gap:10px;justify-items:start}
.b-count{font-family:var(--f-pixel);font-size:clamp(30px,5vw,58px);color:#FFD66B}
.b-wins{display:flex;flex-wrap:wrap;gap:8px}
.b-wins span{font-family:var(--f-pixel);font-size:clamp(14px,2vw,20px);background:#0F1E45;border:2px solid #5FE0C8;border-radius:10px;padding:8px 12px;color:#5FE0C8}
.b-wins .dim{border-color:#2A3C6B;color:#8FB2FF}
.b-empty{color:#8FB2FF;font-size:18px}
.b-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.b-dots{display:flex;gap:6px}
.b-dots button{width:10px;height:10px;border-radius:99px;border:0;background:#2A3C6B;cursor:pointer;padding:0;transition:width .2s}
.b-dots button[aria-current="true"]{background:#5FE0C8;width:26px}
.b-ctrl{display:flex;gap:6px}
.b-ctrl button{background:#0F1E45;border:1px solid #2A3C6B;color:#E6EEFF;border-radius:8px;padding:6px 12px;cursor:pointer}

/* ---- 운영자 보강 ---- */
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row > div{min-width:0}
.switch{width:50px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-pressed="true"]{background:var(--teal)}
.switch[aria-pressed="true"]::after{left:25px}
.rtable-wrap{overflow-x:auto}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable th,.rtable td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable th{font-size:12px;color:var(--muted);font-weight:600}
.rtable td.v{font-family:var(--f-display);font-size:22px;white-space:nowrap;color:var(--blue)}
.vbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;height:190px}
.vbar{display:grid;grid-template-rows:auto 1fr auto;gap:6px;justify-items:center;height:100%;min-width:0}
.vbar .col{width:70%;max-width:56px;align-self:end;background:var(--blue);border-radius:6px 6px 2px 2px}
.vbar.future .col{background:var(--soft)}
.vbar.cur .col{background:var(--teal)}
.vbar .n{font-size:13px;font-variant-numeric:tabular-nums}
.vbar.future .n{color:var(--muted)}
.vbar small{font-family:var(--f-pixel);font-size:8px;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:780px){.checks{grid-template-columns:1fr}}
.checks fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;margin:0;min-width:0}
.checks legend{font-weight:600;font-size:14px;padding:0 6px;color:var(--blue)}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.checks input{margin-top:4px;accent-color:var(--teal)}
.checks label.on span{color:var(--muted);text-decoration:line-through}
.emerg{display:grid;gap:8px}
.emerg div{border-left:3px solid var(--warn);background:var(--paper);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px}
.emerg b{display:block;margin-bottom:2px}
.ztable{display:grid;gap:6px}
.ztable .zr{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.ztable input{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.ztable .zno{font-family:var(--f-pixel);font-size:8px;color:var(--muted)}
.themes{display:flex;flex-wrap:wrap;gap:6px}

/* ---- 패스 보강 ---- */
.hint{display:flex;gap:6px;align-items:flex-start;background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-weight:600}
.hint .ic{color:var(--blue);margin-top:3px}
.bonus{display:flex;gap:8px;align-items:center;border:1.5px dashed var(--teal);color:var(--teal);border-radius:10px;padding:8px 12px;font-size:14px;flex-wrap:wrap}
.bonus b{font-family:var(--f-pixel);font-size:12px;font-weight:400}
.bonus.win{background:var(--teal);color:#fff;border-style:solid}
.privacy{font-size:13px;color:var(--muted);background:var(--paper);border-radius:10px;padding:10px 12px}
.privacy summary{cursor:pointer;font-weight:600}
.privacy p{margin-top:6px;line-height:1.6}

/* ---- 키오스크 ---- */
.kiosk .tabs button:not([data-tab="arcade"]):not([data-tab="board"]){display:none}
.kiosk .demo{display:none}
.kiosk-bar{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;z-index:9}
.kiosk-bar > button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--muted);cursor:pointer}
.kiosk-bar form{display:flex;gap:6px}
.kiosk-bar input{width:80px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
.kiosk-bar form button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}

/* ---- 도입 화면: 입자 타이포 + 오로라 + AI 프롬프트 ---- */
.brand-btn{all:unset;cursor:pointer;font:inherit}
.brand-btn:focus-visible{outline:3px solid #45D6BC;outline-offset:3px;border-radius:6px}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.intro{position:fixed;inset:0;z-index:20;overflow:auto;background:#030B20;color:#fff;display:grid;place-items:center;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.intro.out{animation:introOut .5s ease-in forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.03);filter:blur(6px)}}
.aurora{position:fixed;inset:-20%;filter:blur(80px);pointer-events:none}
.aurora i{position:absolute;border-radius:50%}
.aurora i:nth-child(1){width:60vmax;height:60vmax;left:0;top:-5%;background:radial-gradient(circle,rgba(2,87,166,.95) 0%,transparent 62%);animation:drift1 16s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:48vmax;height:48vmax;right:-4%;top:22%;background:radial-gradient(circle,rgba(2,153,135,.75) 0%,transparent 62%);animation:drift2 20s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:42vmax;height:42vmax;left:28%;bottom:-8%;background:radial-gradient(circle,rgba(70,110,235,.6) 0%,transparent 62%);animation:drift3 24s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(14vw,12vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,-8vh) scale(.9)}}
@keyframes drift3{to{transform:translate(10vw,-14vh) scale(1.2)}}
.grain{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.intro-in{position:relative;display:grid;justify-items:center;text-align:center;gap:18px;width:100%;max-width:760px}
.i-live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.02em;color:rgba(255,255,255,.8);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:6px 14px;animation:rise .7s .2s both}
.live-dot{width:8px;height:8px;border-radius:50%;background:#45F0CF;box-shadow:0 0 0 0 rgba(69,240,207,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(69,240,207,0)}100%{box-shadow:0 0 0 0 rgba(69,240,207,0)}}
#pcv{display:block;max-width:100%;touch-action:pan-y}
.i-sub{font-size:clamp(15px,2.2vw,18px);color:rgba(255,255,255,.82);min-height:1.6em;font-variant-numeric:tabular-nums;animation:rise .6s .5s both}
.prompt{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px;padding:13px 20px;width:min(100%,560px);min-height:54px;box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);animation:rise .7s .9s both}
.prompt::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 62%,#45F0CF 76%,#7AA8FF 88%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3.6s linear infinite;pointer-events:none}
@keyframes spin{to{--ang:360deg}}
.prompt .p-spark{color:#45F0CF;display:grid;flex:0 0 auto;width:auto;height:auto}
.p-label{color:rgba(255,255,255,.55);font-size:14px}
.p-line{display:inline-flex;align-items:center;gap:2px}
.p-text{font-size:16px;font-weight:600;background:linear-gradient(90deg,#FFFFFF,#A6F5E6);-webkit-background-clip:text;background-clip:text;color:transparent}
.caret{width:2px;height:19px;background:#45F0CF;animation:caret 1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
.i-cta{display:inline-flex;align-items:center;gap:10px;border:0;background:#fff;color:#03214A;font-weight:700;font-size:17px;border-radius:99px;padding:14px 28px;cursor:pointer;box-shadow:0 0 0 0 rgba(69,240,207,.4);transition:transform .2s,box-shadow .3s;animation:rise .7s 1.15s both}
.i-cta:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(69,240,207,.35)}
.i-cta small{font-weight:600;font-size:13px;color:#4A6A93}
.i-cta .ic{color:#029987}
.i-feats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;animation:rise .7s 1.3s both}
.i-feats button{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.9);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:600;transition:background .2s,border-color .2s}
.i-feats button:hover{background:rgba(255,255,255,.12);border-color:rgba(69,240,207,.6)}
.i-feats .ic{color:#45F0CF}
.i-hint{font-size:12px;color:rgba(255,255,255,.45);animation:rise .7s 1.6s both}
.i-roles{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);width:min(100%,460px);animation:rise .7s 1.8s both}
.i-roles span{font-size:12.5px;color:rgba(255,255,255,.5);margin-right:4px}
.i-roles button{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.82);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .2s,color .2s}
.i-roles button:hover{border-color:#45F0CF;color:#fff}
.i-roles .ic{color:#7DB0FF}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}


/* ---- 큰 글씨 · 고대비 ---- */
.a11y{margin-left:auto;position:relative}
.a11y-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px}
.a11y-btn span{font-family:var(--f-display);font-size:17px;line-height:1}
.a11y-pop{position:absolute;right:0;top:calc(100% + 8px);width:290px;max-width:calc(100vw - 32px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:4px 16px;box-shadow:0 14px 34px rgba(0,0,0,.2);z-index:15}
html.big .top-in{zoom:1.1}
html.big .demo,html.big main{zoom:1.16}
html.big .cabinet,html.big .board{zoom:.862}
:root.hc{--paper:#FFFFFF;--card:#FFFFFF;--ink:#000000;--muted:#243049;--line:#3B4662;--soft:#E3EAF6;--head:#002B61;--blue:#003C86;--blue-soft:#D8E5F9;--teal:#00665A;--teal-soft:#CFEFE9;--warn:#A31D0B;--warn-soft:#FAD9D2;--n1:#D3E2FF;--n2:#CBEFE5;--n3:#FFE9AD;--n4:#F8D2DC}
@media (prefers-color-scheme: dark){:root.hc:not([data-theme="light"]){--paper:#000000;--card:#0A0F1D;--ink:#FFFFFF;--muted:#D6DEF0;--line:#9BA7C5;--soft:#17223F;--head:#00224D;--blue:#96C7FF;--blue-soft:#11284F;--teal:#68F3D7;--teal-soft:#0B3B34;--warn:#FFA28E;--warn-soft:#3D1611;--n1:#22396E;--n2:#154A41;--n3:#4C411E;--n4:#4E2240;color-scheme:dark}}
:root.hc[data-theme="dark"]{--paper:#000000;--card:#0A0F1D;--ink:#FFFFFF;--muted:#D6DEF0;--line:#9BA7C5;--soft:#17223F;--head:#00224D;--blue:#96C7FF;--blue-soft:#11284F;--teal:#68F3D7;--teal-soft:#0B3B34;--warn:#FFA28E;--warn-soft:#3D1611;--n1:#22396E;--n2:#154A41;--n3:#4C411E;--n4:#4E2240;color-scheme:dark}
.hc .card,.hc .btn.ghost,.hc .chip,.hc .locker,.hc .stile,.hc .step,.hc .table-card,.hc .kpi,.hc .cart,.hc .qitem,.hc .chapter,.hc .field input,.hc .field select,.hc .field textarea,.hc .zlist li{border:2px solid var(--ink)}
.hc :focus-visible{outline:4px solid var(--warn);outline-offset:3px}
.hc .tabs button{opacity:1;text-decoration:underline;text-underline-offset:4px}
.hc .tabs button[aria-selected="true"]{text-decoration:none}
.hc .demo{color:var(--ink)}

/* ---- 공용 노트북(게임 스테이션) ---- */
.tipbar{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.tipbar .ic{color:var(--blue);margin-top:2px}
.cart .kb{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--blue);font-weight:600;margin-top:2px}
.stampbox{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.stampbox > .stack{flex:1;min-width:200px}
.stampbox.big .pseudoqr{width:190px;height:190px}
.st-label{background:var(--blue);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600}

/* ---- 위로 모음집 ---- */
.big-seg{justify-self:start}
.big-seg button{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;font-weight:600}
.book{display:grid;gap:18px}
.book-cover{position:relative;overflow:hidden;border-radius:22px;padding:clamp(24px,4.5vw,44px);background:linear-gradient(140deg,#0257A6 0%,#073F7D 70%,#062E5E 100%);color:#fff;display:grid;gap:12px}
.book-cover::before{content:"\201C";position:absolute;right:14px;top:-44px;font-family:"Gowun Batang",serif;font-size:240px;line-height:1;color:rgba(255,255,255,.08)}
.book-cover::after{content:"";position:absolute;right:28px;bottom:26px;width:18px;height:18px;border-radius:50%;background:#029987}
.bc-eye{font-family:var(--f-pixel);font-size:9px;letter-spacing:.1em;color:#9FD9FF;line-height:1.7}
.bc-title{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(36px,6.5vw,58px);line-height:1.15}
.bc-meta{opacity:.82;font-size:14px}
.bc-feat{margin:8px 0 0;padding:18px 20px;border-radius:16px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);display:grid;gap:8px;max-width:620px}
.bc-feat blockquote{margin:0;font-family:"Gowun Batang",serif;font-size:clamp(19px,2.6vw,25px);line-height:1.6}
.bc-feat figcaption{font-size:13px;opacity:.78}
.bc-feat button{justify-self:start;background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13px}
.chapter{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,28px);display:grid;gap:16px}
.ch-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.ch-no{font-family:"Gowun Batang",serif;font-weight:700;font-size:42px;line-height:1;color:var(--blue);min-width:52px}
.ch-head > div{display:grid;gap:6px;justify-items:start}
.ch-head h3{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(19px,2.4vw,23px);line-height:1.45}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.quote{margin:0;padding:16px 18px;border-radius:4px 16px 16px 4px;border-left:4px solid var(--blue);display:grid;gap:10px;align-content:space-between}
.quote.paper-2{border-left-color:var(--teal)}
.quote blockquote{margin:0;font-family:"Gowun Batang",serif;font-size:17px;line-height:1.7}
.quote figcaption{font-size:12px;color:var(--muted)}
.book-foot{border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:12px}

/* ======================================================================
   디자인 통일: 도입 화면의 오로라 · 글래스 · 청록 글로우를 앱 전체에
   ====================================================================== */
:root:root:root{--paper:#040B20;--card:#0B1734;--ink:#EAF1FF;--muted:#97A7C8;--line:rgba(150,180,255,.16);--soft:#13224A;--head:transparent;
  --blue:#7DB0FF;--blue-soft:rgba(125,176,255,.13);--teal:#45F0CF;--teal-soft:rgba(69,240,207,.12);--warn:#FF8A73;--warn-soft:rgba(255,138,115,.13);
  --n1:#1B3466;--n2:#113E3A;--n3:#3B3420;--n4:#3D2142;
  --glass:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.022));--gline:rgba(160,195,255,.15);
  --grad:linear-gradient(135deg,#7DB0FF,#45F0CF);color-scheme:dark}
:root:root.hc{--paper:#000;--card:#0A0F1D;--ink:#fff;--muted:#D6DEF0;--line:#9BA7C5;--soft:#17223F;--blue:#96C7FF;--blue-soft:#11284F;--teal:#68F3D7;--teal-soft:#0B3B34;--warn:#FFA28E;--warn-soft:#3D1611;--n1:#22396E;--n2:#154A41;--n3:#4C411E;--n4:#4E2240;--glass:#0A0F1D;--gline:#9BA7C5}
body{background:#040B20;color:var(--ink)}
.app-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.app-bg .aurora{opacity:.5}
.app-bg .aurora i{animation-duration:38s}
.hc .app-bg{display:none}
::selection{background:rgba(69,240,207,.35)}

/* 헤더: 떠 있는 글래스 바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:rgba(4,11,32,.62);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--gline);padding:14px 16px 12px;color:var(--ink)}
.brand h1{font-size:24px}
.brand .dot{background:#45F0CF;box-shadow:0 0 0 4px rgba(69,240,207,.15),0 0 16px #45F0CF}
.brand span{color:var(--muted);opacity:1}
.tabs{gap:6px;margin-top:12px}
.tabs button{border-radius:99px;padding:8px 15px;opacity:1;color:var(--muted);border:1px solid transparent;transition:color .2s,background .2s}
.tabs button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(69,240,207,.45);box-shadow:0 0 22px rgba(69,240,207,.16)}
.a11y-btn{background:rgba(255,255,255,.06);border-color:var(--gline)}
.demo{color:var(--muted);opacity:.8}
main{padding-top:16px}

/* 공통 표면 */
.card,.kpi,.chapter,.cart,.table-card,.step,.qitem,.next,.stile,.timer,.res-card,.met li,.tipbar,.zlist li,.locked,.emerg div,.alerts li,.privacy,.preview-plate,.hint,.steps div,.checks fieldset{background:var(--glass);border:1px solid var(--gline)}
.card,.chapter{border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.28)}
.eyebrow{color:#86B9FF;letter-spacing:.12em}
.muted{color:var(--muted)}
.bub{background:rgba(125,176,255,.1);color:#A9CBFF;border:1px solid rgba(125,176,255,.22)}
.sec-h .ic{color:var(--teal)}
.nameplate b{color:var(--muted)}
.codebox{color:#fff;text-shadow:0 0 16px rgba(125,176,255,.45)}

/* 버튼 */
:root .btn{background:#fff;color:#03214A;border:0;border-radius:99px;padding:10px 18px;font-weight:700;transition:transform .15s,box-shadow .25s}
:root .btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(69,240,207,.22)}
:root .btn.teal{background:linear-gradient(135deg,#6AF7DC,#2CC4A8);color:#04292A}
:root .btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--gline)}
:root .btn.ghost:hover{border-color:rgba(69,240,207,.5);box-shadow:none}
:root .btn.sm{padding:7px 13px}
:root .btn.big{padding:13px 22px}
:root .btn:disabled{transform:none;box-shadow:none}

/* 입력 */
.field input,.field select,.field textarea,.ztable input,.kiosk-bar input{background:rgba(2,8,26,.6);border:1px solid var(--gline);color:var(--ink);border-radius:12px}
.field input:focus,.field select:focus,.field textarea:focus,.ztable input:focus{outline:none;border-color:rgba(69,240,207,.7);box-shadow:0 0 0 4px rgba(69,240,207,.12)}
select option{background:#0B1734;color:#EAF1FF}
::placeholder{color:#6A7BA0}

/* 칩 · 세그먼트 · 태그 */
.chip,.seg button,.subnav button,.daypick button,.metoo{background:rgba(255,255,255,.05);border:1px solid var(--gline);color:var(--muted)}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"],.subnav button[aria-pressed="true"],.daypick button[aria-pressed="true"],.metoo[aria-pressed="true"]{background:linear-gradient(135deg,rgba(125,176,255,.3),rgba(69,240,207,.22));border-color:rgba(69,240,207,.55);color:#fff;box-shadow:0 0 22px rgba(69,240,207,.15)}
.metoo{color:#A9CBFF;border-color:rgba(125,176,255,.35)}
.tag{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--gline)}
.tag.blue{background:rgba(125,176,255,.13);color:#B3D1FF;border-color:rgba(125,176,255,.28)}
.tag.teal{background:rgba(69,240,207,.11);color:#86F6DF;border-color:rgba(69,240,207,.3)}
.tag.gold{background:rgba(255,214,107,.12);color:#FFD66B;border-color:rgba(255,214,107,.3)}

/* 패스 */
.onb-art{background:linear-gradient(150deg,rgba(2,87,166,.7),rgba(4,24,66,.7) 60%,rgba(2,153,135,.35));border:1px solid var(--gline);border-radius:24px}
.onb-art::after{box-shadow:0 0 16px #45F0CF}
.passhero{background:linear-gradient(135deg,rgba(2,87,166,.62),rgba(5,28,78,.55) 55%,rgba(2,153,135,.32));border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.passhero::before{content:"";left:0;top:0;right:0;bottom:0;width:auto;height:auto;border:0;position:absolute;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 60%,#45F0CF 75%,#7AA8FF 88%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
.passhero::after{background:#45F0CF;box-shadow:0 0 16px #45F0CF}
.ph-eye{color:#9FD9FF}
.ph-chips span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.ph-chips .gold{background:rgba(69,240,207,.18);border-color:rgba(69,240,207,.45);color:#86F6DF}
.next{border-color:rgba(69,240,207,.38);box-shadow:0 0 30px rgba(69,240,207,.08);border-radius:18px}
.next b{color:#86F6DF}
.next .bub{background:rgba(69,240,207,.12);color:#45F0CF;border-color:rgba(69,240,207,.3)}
.step{border-radius:18px}
.step.now{border-color:rgba(125,176,255,.45)}
.step.done{border-color:rgba(69,240,207,.5);box-shadow:0 0 24px rgba(69,240,207,.1)}
.step.done .bub{background:var(--grad);color:#04292A;border:0}
.step .mini,.progress{background:rgba(255,255,255,.07)}
.step .mini i,.progress i,.step.done .mini i{background:var(--grad);box-shadow:0 0 12px rgba(69,240,207,.4)}
canvas#puzzle{border-radius:16px;box-shadow:0 0 0 1px var(--gline)}
.zlist li{border-radius:12px}
.zlist li.done{background:rgba(69,240,207,.09);border-color:rgba(69,240,207,.3)}
.zlist .zi{background:rgba(125,176,255,.14);color:#B3D1FF}
.zlist li.done .zi{background:var(--grad);color:#04292A}
.stile{border-style:dashed;border-radius:18px}
.stile .go{color:#86F6DF}
.stile.on{border:1px solid rgba(69,240,207,.45);background:radial-gradient(circle at 50% 35%,rgba(69,240,207,.16),rgba(255,255,255,.03) 70%)}
.stile .seal{border-color:#45F0CF;color:#45F0CF;box-shadow:0 0 18px rgba(69,240,207,.28),inset 0 0 12px rgba(69,240,207,.15)}
.lticket{background:linear-gradient(135deg,#1A6FD0,#0B3F7A 70%);border:1px solid rgba(125,176,255,.35);box-shadow:0 14px 40px rgba(2,87,166,.3)}
.lticket.win{background:linear-gradient(135deg,#2CC4A8,#0B7A6C)}
.lticket.lock{background:rgba(255,255,255,.03);color:var(--ink);border:1px dashed rgba(125,176,255,.4);box-shadow:none}
.lt-need b{color:#86F6DF}
.dots i{border-color:#7DB0FF}.dots i.on{background:var(--grad);border-color:transparent}
.bonus{border-color:rgba(69,240,207,.5);color:#86F6DF}
.hint{background:rgba(125,176,255,.1);border-color:rgba(125,176,255,.25)}
.hint .ic{color:#45F0CF}

/* 아케이드 */
.tipbar{border-radius:16px}
.tipbar .ic{color:#45F0CF}
.cart{border-radius:16px 16px 8px 8px}
.cart::before{background:repeating-linear-gradient(90deg,rgba(160,195,255,.25) 0 6px,transparent 6px 10px)}
.cart[aria-pressed="true"]{border-color:rgba(69,240,207,.55);background:linear-gradient(160deg,rgba(125,176,255,.18),rgba(69,240,207,.1));box-shadow:0 0 26px rgba(69,240,207,.15)}
.cart .kb{color:#86F6DF}
.cabinet{background:rgba(2,7,22,.82);border:1px solid rgba(69,240,207,.25);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.45),0 0 70px rgba(2,153,135,.1)}
canvas#ac{border-radius:12px;box-shadow:0 0 0 1px rgba(125,176,255,.15)}
.lb li{border-bottom-color:var(--gline)}
.lb li.me{background:linear-gradient(90deg,rgba(69,240,207,.14),transparent)}
.lb .sc{color:#86F6DF}

/* 고민 사물함 · 모음집 */
.locker{background:linear-gradient(180deg,#16295A,#0D1B3E);border:1px solid var(--gline);border-radius:12px;transition:transform .2s,box-shadow .2s}
.locker:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.locker::before{background:repeating-linear-gradient(90deg,rgba(160,195,255,.22) 0 16px,transparent 16px 22px)}
.locker::after{background:rgba(160,195,255,.3)}

@keyframes pnew{from{transform:translateY(-9px) scale(1.25);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}
.p-send{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6AF7DC,#2CC4A8);color:#04292A}

/* ---- 잠금 화면 (스태프 · 관리) ---- */
.lockscr{position:fixed;inset:0;z-index:25;overflow:auto;background:#030B20;color:#fff;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock-in{position:relative;display:grid;justify-items:center;text-align:center;gap:14px;width:min(100%,360px);animation:rise .5s both}
.lock-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#45F0CF;box-shadow:0 0 40px rgba(69,240,207,.18)}
.lockscr h2{font-size:34px;line-height:1.1}
.lockscr .ld{font-size:14px;color:rgba(255,255,255,.7);line-height:1.6}
.pin-dots{display:flex;gap:14px;margin:6px 0 2px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transition:background .15s,border-color .15s,box-shadow .15s}
.pin-dots i.on{background:#45F0CF;border-color:#45F0CF;box-shadow:0 0 14px rgba(69,240,207,.7)}
.pin-dots.err{animation:shake .35s}
.pin-dots.err i{border-color:#FF8A73}
.lock-msg{min-height:20px;font-size:13px;color:#FF9C88}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{height:64px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:var(--f-display);font-size:28px;cursor:pointer;transition:background .15s,border-color .15s}
.keypad button:hover{background:rgba(255,255,255,.12);border-color:rgba(69,240,207,.5)}
.keypad button:active{background:rgba(69,240,207,.25)}
.keypad .k-sm{font-family:var(--f-body);font-size:13px;font-weight:600;color:rgba(255,255,255,.75)}
.lock-hint{font-size:12px;color:rgba(255,255,255,.45)}
.lock-back{background:none;border:0;color:rgba(255,255,255,.7);font-weight:600;cursor:pointer;padding:6px 10px;border-radius:99px}
.lock-back:hover{color:#fff}
.lockbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--gline);color:var(--muted);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-weight:600}

/* ======================= 휴대용 레트로 게임기 ======================= */
.arcade .cabinet{position:relative;background:linear-gradient(160deg,#0A63BA 0%,#0257A6 45%,#014A8E 100%);border:0;border-radius:26px 26px 72px 26px;padding:16px 18px 26px;display:grid;gap:14px;color:#EAF3FF;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.18),0 24px 60px rgba(0,0,0,.35)}
body.t-staff .arcade .cabinet,body.t-admin .arcade .cabinet{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.18),0 18px 40px rgba(2,40,90,.28)}
.cn-top{display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-size:8px;letter-spacing:.12em;color:rgba(255,255,255,.6)}
.cn-led{width:9px;height:9px;border-radius:50%;background:#FF5A4F;box-shadow:0 0 10px #FF5A4F}
.cn-brand{margin-left:auto;font-size:11px;color:#fff;font-style:italic;letter-spacing:.08em;text-shadow:0 2px 0 rgba(0,0,0,.25)}

.cn-top{position:relative}
.cn-full{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;background:#0B1430;color:#CFE0FF;border:0;border-radius:99px;padding:6px 13px;font:700 12px/1 var(--f-body,inherit);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap}
.cn-full:active{transform:translate(-50%,calc(-50% + 2px));box-shadow:0 1px 0 rgba(0,0,0,.35)}
.cn-full:focus-visible{outline:3px solid #45F0CF;outline-offset:2px}
body.fs-on{overflow:hidden}
#console.fs{position:fixed!important;top:50%;left:50%;margin:0;z-index:70;transform-origin:center center;transform:translate(-50%,-50%) scale(var(--s,1));box-shadow:0 0 0 100vmax rgba(3,10,25,.94),inset 0 2px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.18)!important}
.cn-bezel{background:#151C33;border-radius:14px 14px 40px 14px;padding:12px 16px 12px;display:grid;gap:8px;box-shadow:inset 0 3px 10px rgba(0,0,0,.5)}
.cn-label{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:#8FB2FF}
.cn-label #gName{font-family:var(--f-display);font-size:19px;color:#fff}
.cn-bezel .screen{border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #0B1022}
.cn-bezel canvas#ac{border-radius:0;box-shadow:none}
.cn-logo{font-family:var(--f-pixel);font-size:8px;letter-spacing:.14em;color:#6F82B0;text-align:left}
.cn-logo i{color:#45F0CF;font-style:normal}
.cn-type .ac-in{background:#0B1430;border:2px solid #2A4C8C;color:#fff}
.cn-ctrls{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:4px 6px 0}
.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.dpad button,.dp-c{background:#1A2038;border:0;cursor:pointer;position:relative;padding:0}
.dpad button:active{background:#0F142A;transform:translateY(2px)}
.dpad button::after{content:"";position:absolute;inset:0;margin:auto;width:0;height:0;border:7px solid transparent}
.dp-u{grid-area:1/2;border-radius:8px 8px 0 0}.dp-u::after{border-bottom-color:#5B6A90!important;border-top:0!important;top:-4px!important}
.dp-l{grid-area:2/1;border-radius:8px 0 0 8px}.dp-l::after{border-right-color:#5B6A90!important;border-left:0!important;left:-4px!important}
.dp-c{grid-area:2/2;cursor:default}
.dp-c::before{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#262D48,#141A30)}
.dp-r{grid-area:2/3;border-radius:0 8px 8px 0}.dp-r::after{border-left-color:#5B6A90!important;border-right:0!important;right:-4px!important}
.dp-d{grid-area:3/2;border-radius:0 0 8px 8px}.dp-d::after{border-top-color:#5B6A90!important;border-bottom:0!important;bottom:-4px!important}
.dpad[data-off="1"]{opacity:.55}
.cn-pills{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;transform:rotate(-14deg)}
.pill{background:#1A2038;color:#C9D6F5;border:0;border-radius:99px;padding:7px 14px;font-size:11.5px;font-weight:700;letter-spacing:.04em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.pill:disabled{opacity:.45;cursor:not-allowed}
.pill[aria-pressed="false"]{color:#7C88A8}
.abtns{display:flex;gap:16px;align-items:flex-end;transform:rotate(-14deg);padding-right:4px}
.slot-a{margin-bottom:22px}
.slot-a,.slot-b{min-width:66px;display:grid;justify-items:center}
.rbtn{background:none;border:0;padding:0;cursor:pointer;display:grid;justify-items:center;gap:8px;color:#EAF3FF;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.rbtn::before{content:attr(data-l);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-pixel);font-size:16px;color:rgba(255,255,255,.9);
  background:radial-gradient(circle at 38% 32%,#FF8C8F,#D7263D 70%);box-shadow:0 5px 0 #8E1426,0 8px 14px rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s}
.rb-a::before{background:radial-gradient(circle at 38% 32%,#8CFFE8,#1CB79B 70%);box-shadow:0 5px 0 #0B6E5E,0 8px 14px rgba(0,0,0,.35);color:#053A33}
.rbtn:active::before{transform:translateY(4px);box-shadow:0 1px 0 #8E1426}
.rb-a:active::before{box-shadow:0 1px 0 #0B6E5E}
.rbtn:disabled{cursor:not-allowed;color:rgba(255,255,255,.45)}
.rbtn:disabled::before{filter:saturate(.25) brightness(.8)}
.rbtn:focus-visible{outline:none}.rbtn:focus-visible::before{outline:3px solid #fff;outline-offset:3px}
.cn-grill{position:absolute;right:30px;bottom:18px;display:flex;gap:7px;transform:rotate(-28deg);pointer-events:none}
.cn-grill i{width:6px;height:38px;border-radius:99px;background:rgba(0,0,0,.22);box-shadow:inset 0 2px 2px rgba(0,0,0,.25)}
@media (max-width:560px){
  .arcade .cabinet{padding:14px 12px 30px;border-radius:22px 22px 56px 22px}
  .cn-bezel{padding:10px;border-radius:10px 10px 28px 10px}
  .cn-ctrls{grid-template-columns:auto auto;grid-template-areas:"pad ab" "pills pills";justify-content:space-between;row-gap:18px}
  .dpad{grid-area:pad;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px)}
  .abtns{grid-area:ab}.cn-pills{grid-area:pills;transform:none}
  .rbtn::before{width:54px;height:54px}
  .cn-grill{display:none}
}

let actx=null;
const SFX={hit:[[660],.06,'square'],great:[[740,990],.06,'square'],perfect:[[880,1320],.07,'square'],miss:[[180],.18,'sawtooth'],bad:[[140,110],.12,'sawtooth'],
  count:[[520],.1,'square'],go:[[1040],.2,'square'],end:[[523,392,262],.14,'triangle'],record:[[523,659,784,1047],.11,'square'],click:[[420],.03,'square']};

  fr.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*len;o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+len+.02)})}catch(e){}}

function runLoop(update){let last=null,alive=true;const f=now=>{if(!alive)return;if(last===null)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!PAUSED&&update(dt,now)===false){alive=false;return}requestAnimationFrame(f)};requestAnimationFrame(f);return()=>{alive=false}}

function schoolRank(){
